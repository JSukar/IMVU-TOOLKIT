[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imvu-toolkit"
version = "1.1.0"
description = "Fix chat emoji and optional DPI scaling for IMVU Classic on Windows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "JSukar" }]
keywords = ["imvu", "emoji", "dpi", "windows"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
build = ["pyinstaller>=6.0", "pillow>=10.0"]
gui = ["pillow>=10.0"]

[project.scripts]
imvu-toolkit = "imvu_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"patches/dpi/*.py" = ["E501"]
"scripts/*.py" = ["E501"]
