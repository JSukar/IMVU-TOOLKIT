name: Bug report
description: Report a problem with a patch or the installer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Include steps to reproduce and whether restore was tried.
  - type: input
    id: imvu-version
    attributes:
      label: IMVU Classic version (if known)
      placeholder: e.g. build date or client version from About
  - type: dropdown
    id: patch
    attributes:
      label: Which patch or tool?
      options:
        - Emoji patch / installer
        - DPI clean layout
        - Dialog scaling
        - Room overlay hitboxes
        - Overlay click remap
        - White line
        - Other
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Run ... 2. Open IMVU ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: restore
    attributes:
      label: Did --restore help?
      placeholder: e.g. python patch_imvu_emoji.py --restore
  - type: textarea
    id: logs
    attributes:
      label: Terminal output or screenshots
      render: shell
