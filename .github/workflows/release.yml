name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build installer
        shell: pwsh
        run: ./build_installer.ps1
      - name: Write release notes from CHANGELOG
        shell: pwsh
        run: |
          python scripts/extract_changelog.py CHANGELOG.md "${{ github.ref_name }}" > release_notes.md
          $emojiExe = "dist/IMVU-Emoji-Installer.exe"
          $antibotExe = "dist/IMVU-Antibot-Installer.exe"
          $emojiHash = (Get-FileHash $emojiExe -Algorithm SHA256).Hash.ToLower()
          $antibotHash = (Get-FileHash $antibotExe -Algorithm SHA256).Hash.ToLower()
          @"

          ## Verification

          "@ | Add-Content -Path release_notes.md -Encoding utf8
          Add-Content -Path release_notes.md -Encoding utf8 ('**IMVU-Emoji-Installer.exe SHA256:** `{0}`' -f $emojiHash)
          Add-Content -Path release_notes.md -Encoding utf8 ('**IMVU-Antibot-Installer.exe SHA256:** `{0}`' -f $antibotHash)
          Add-Content -Path release_notes.md -Encoding utf8 ""
          Add-Content -Path release_notes.md -Encoding utf8 ("[Emoji VirusTotal report](https://www.virustotal.com/gui/file/{0})" -f $emojiHash)
          Add-Content -Path release_notes.md -Encoding utf8 ("[Antibot VirusTotal report](https://www.virustotal.com/gui/file/{0})" -f $antibotHash)
          Add-Content -Path release_notes.md -Encoding utf8 ""
          Add-Content -Path release_notes.md -Encoding utf8 '**Defender blocked the download?** Clone the repo and run `install.ps1` / `install_antibot.ps1` or the matching `install_*_gui.ps1` scripts (Python, no bundled .exe).'
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/IMVU-Emoji-Installer.exe
            dist/IMVU-Antibot-Installer.exe
          body_path: release_notes.md
