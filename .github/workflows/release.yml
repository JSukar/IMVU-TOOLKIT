name: Release  on:   push:     tags:       - "v*"  jobs:   release:     runs-on: windows-latest     permissions:       contents: write     steps:       - uses: actions/checkout@v6       - uses: actions/setup-python@v6         with:           python-version: "3.12"       - name: Install build dependencies         run: python -m pip install -e ".[build]"       - name: Build installer         shell: pwsh         run: ./build_installer.ps1       - name: Write release notes from CHANGELOG         shell: pwsh         run: |           python scripts/extract_changelog.py CHANGELOG.md "${{ github.ref_name }}" > release_notes.md       - name: Create GitHub Release         uses: softprops/action-gh-release@v3         with:           files: dist/IMVU-Emoji-Installer.exe           body_path: release_notes.md